<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabeltrainer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; padding: 0; background-color: #f4f4f9; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn { padding: 10px 15px; margin: 5px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background-color: #0056b3; }
    .hidden { display: none; }
    
    /* Styles für das Fehler-Modal (Pop-up) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .modal-content h3 { color: #d9534f; margin-top: 0; }
    .modal-detail { margin: 10px 0; text-align: left; background: #f8f9fa; padding: 10px; border-radius: 4px; }
    .wrong-text { color: #d9534f; font-weight: bold; }
    .correct-text { color: #5cb85c; font-weight: bold; }

    /* Tabelle für die Zusammenfassung am Ende */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>

<div class="container">
  <h2>Vokabeltrainer</h2>
  
  <div id="mode-selection">
    <button class="btn" onclick="startQuiz()">Quiz-Modus starten</button>
  </div>

  <div id="quiz-area" class="hidden">
    <h3 id="question-text"></h3>
    <div id="options-container"></div>
  </div>

  <div id="end-screen" class="hidden">
    <h3>Lektion beendet!</h3>
    <p id="final-score"></p>
    
    <div id="wrong-words-summary">
      <h4>Falsch beantwortete Wörter:</h4>
      <table id="summary-table">
        <thead>
          <tr>
            <th>Vorgegebenes Wort</th>
            <th>Deine falsche Wahl</th>
            <th>Richtige Übersetzung</th>
          </tr>
        </thead>
        <tbody id="summary-body"></tbody>
      </table>
    </div>
    
    <button class="btn" onclick="location.reload()">Neustart</button>
  </div>
</div>

<div id="error-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>Falsche Antwort!</h3>
    <div class="modal-detail">
      <p><strong>Vorgegeben:</strong> <span id="modal-given"></span></p>
      <p><strong>Deine Wahl:</strong> <span id="modal-chosen" class="wrong-text"></span></p>
      <p><strong>Richtig wäre gewesen:</strong> <span id="modal-correct" class="correct-text"></span></p>
    </div>
    <button class="btn" onclick="closeModal()">Weiter</button>
  </div>
</div>

<script>
  // Beispiel-Vokabeln
  const vocabulary = [
    { word: "Apple", translation: "Apfel" },
    { word: "House", translation: "Haus" },
    { word: "Dog", translation: "Hund" },
    { word: "Book", translation: "Buch" }
  ];

  let currentIndex = 0;
  let wrongAnswersList = [];
  let onModalCloseCallback = null;

  function startQuiz() {
    document.getElementById('mode-selection').classList.add('hidden');
    document.getElementById('quiz-area').classList.remove('hidden');
    currentIndex = 0;
    wrongAnswersList = [];
    showNextQuestion();
  }

  function showNextQuestion() {
    if (currentIndex >= vocabulary.length) {
      endLesson();
      return;
    }

    const currentItem = vocabulary[currentIndex];
    document.getElementById('question-text').innerText = `Was heißt "${currentItem.word}"?`;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    // Antworten mischen (richtige Antwort + Distraktoren)
    let options = vocabulary.map(v => v.translation);
    options = shuffleArray(options);

    options.forEach(option => {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.innerText = option;
      btn.onclick = () => checkAnswer(currentItem.word, option, currentItem.translation);
      optionsContainer.appendChild(btn);
    });
  }

  function checkAnswer(givenWord, chosenAnswer, correctAnswer) {
    if (chosenAnswer === correctAnswer) {
      // Richtig beantwortet
      currentIndex++;
      showNextQuestion();
    } else {
      // Falsch beantwortet: In Fehler-Liste eintragen
      wrongAnswersList.push({
        given: givenWord,
        chosen: chosenAnswer,
        correct: correctAnswer
      });

      // Fehler-Modal anzeigen
      showErrorModal(givenWord, chosenAnswer, correctAnswer, () => {
        currentIndex++;
        showNextQuestion();
      });
    }
  }

  function showErrorModal(given, chosen, correct, onClose) {
    document.getElementById('modal-given').innerText = given;
    document.getElementById('modal-chosen').innerText = chosen;
    document.getElementById('modal-correct').innerText = correct;
    
    onModalCloseCallback = onClose;
    document.getElementById('error-modal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('error-modal').classList.add('hidden');
    if (onModalCloseCallback) {
      onModalCloseCallback();
    }
  }

  function endLesson() {
    document.getElementById('quiz-area').classList.add('hidden');
    document.getElementById('end-screen').classList.remove('hidden');

    const total = vocabulary.length;
    const errors = wrongAnswersList.length;
    document.getElementById('final-score').innerText = `Du hast ${total - errors} von ${total} Wörtern richtig beantwortet.`;

    const summaryBody = document.getElementById('summary-body');
    summaryBody.innerHTML = '';

    if (wrongAnswersList.length === 0) {
      document.getElementById('wrong-words-summary').innerHTML = '<p class="correct-text">Perfekt! Du hast keine Fehler gemacht!</p>';
    } else {
      wrongAnswersList.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.given}</td>
          <td class="wrong-text">${item.chosen}</td>
          <td class="correct-text">${item.correct}</td>
        `;
        summaryBody.appendChild(row);
      });
    }
  }

  function shuffleArray(array) {
    return array.sort(() => Math.random() - 0.5);
  }
</script>

</body>
</html>
